<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LMS - My Profile</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav>
        <h2>LMS Admin</h2>
        <ul>
            <li><a href="admin-dashboard.html">Dashboard</a></li>
            <li><a href="manage-users.html">Manage Users</a></li>
            <li><a href="course-approvals.html">Course Approvals</a></li>
            <li><a href="manage-categories.html">Categories</a></li>
            <li><a href="admin-profile.html">Profile</a></li>
        </ul>
    </nav>

    <main>
        <h1>My Profile</h1>

            <div class="profile-picture-section">
                <div id="profile-pic-placeholder" class="pic-circle">No Photo</div>
                <img id="profile-pic-preview" class="pic-circle" style="display: none;" alt="Profile Picture">
                <div>
                    <label for="profile-pic-input" class="upload-label">Change Photo</label>
                    <input type="file" id="profile-pic-input" accept="image/*" hidden>
                </div>
            </div>

        <form id="profile-form">
            <div class="form-group">
                <label for="profile-id">User ID</label>
                <input type="text" id="profile-id" disabled>
            </div>

            <div class="form-group">
                <label for="profile-name">Full Name</label>
                <input type="text" id="profile-name" value="Admin User" required>
            </div>

            <div class="form-group">
                <label for="profile-email">Email</label>
                <input type="email" id="profile-email" value="admin@lms.com" required>
            </div>

            <div class="form-group">
                <label for="profile-role">Role</label>
                <input type="text" id="profile-role" value="Administrator" disabled>
            </div>

            <h3>Change Password (optional)</h3>

            <div class="form-group">
                <label for="new-password">New Password</label>
                <div class="password-wrapper">
                    <input type="password" id="new-password" minlength="7">
                    <span class="toggle-password" data-target="new-password">Show</span>
                </div>
            </div>

            <div class="form-group">
                <label for="confirm-new-password">Confirm New Password</label>
                <div class="password-wrapper">
                    <input type="password" id="confirm-new-password" minlength="7">
                    <span class="toggle-password" data-target="confirm-new-password">Show</span>
                </div>
            </div>

            <button type="submit">Save Changes</button>
        </form>

        <p id="profile-message"></p>
    </main>

    <script src="script.js"></script>
</body>
</html>
