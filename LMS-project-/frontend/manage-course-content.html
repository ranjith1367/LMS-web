<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>LMS - Manage Course Content</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <nav>
            <h2>LMS Trainer</h2>
            <ul>
                <li><a href="trainer-dashboard.html">Dashboard</a></li>
                <li><a href="create-course.html">Create Course</a></li>
                <li><a href="my-students.html">My Students</a></li>
                <li><a href="evaluate-assignments.html">Evaluate</a></li>
                <li><a href="trainer-profile.html">Profile</a></li>
                <li><a href="trainer-dashboard.html">Course Content</a></li>
            </ul>
        </nav>
        <main>
    <h1 id="manage-course-title">
        Manage Course Content
    </h1>

    <p id="trainer-content-message"></p>

    <section>
        <h2>Create Module</h2>

        <form id="add-module-form">
            <div class="form-group">
                <label for="module-name">
                    Module Name
                </label>

                <input
                    type="text"
                    id="module-name"
                    required
                    placeholder="Example: Python Basics">
            </div>

            <div class="form-group">
                <label for="module-description">
                    Description
                </label>

                <textarea
                    id="module-description"
                    placeholder="Describe this module">
                </textarea>
            </div>

            <div class="form-group">
                <label for="module-order">
                    Module Order
                </label>

                <input
                    type="number"
                    id="module-order"
                    min="1"
                    required
                    placeholder="1">
            </div>

            <button type="submit">
                Add Module
            </button>
        </form>
    </section>

    <hr>

    <section>
        <h2>Existing Modules</h2>

        <div id="module-list">
            <p>Loading modules...</p>
        </div>
    </section>
</main>
        <script src="script.js"></script>
    </body>
</html>
