<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>LMS - Forget Password</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <main>
            <h1>Learning Management System</h1>
            <form id="forget-password-form">
                <h2>Reset Your Password</h2>
                <p>Enter your registered email and we'll send you a link to reset your password.</p>

                <div class="form-group">
                    <label for="forget-email">Email</label>
                    <input type="email" id="forget-email" required>
                </div>

                <button type="submit">Send Reset Link</button>
            </form>

            <p id="forget-password-message"></p>
            <p><a href="index.html">Back to Login</a></p>
        </main>
        <script src="script.js"></script>
    </body>
</html>
